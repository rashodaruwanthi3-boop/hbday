<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Sweet Heart!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0px 15px 30px rgba(255, 77, 109, 0.2);
            margin: 20px auto;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .wish-text {
            font-size: 1.3em;
            color: #c92a2a;
            font-weight: bold;
            line-height: 1.6;
            margin: 20px 0;
            background: #fff0f3;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #ff85a1;
        }
        .photo-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin: 25px 0;
        }
        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 18px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 320px;
        }
        .photo-card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }
        .photo-caption {
            margin-top: 8px;
            font-size: 0.95em;
            color: #ff4d6d;
            font-weight: 600;
        }
        .heart {
            color: #ff4d6d;
            font-size: 28px;
            animation: beat 1s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️✨❤️</div>
        <h1>Happy Birthday mage pana....! 🎉</h1>

        <div class="wish-text">
            Happy Birthday My Sweet Heart❤️❤️❤️ <br>
            mn oyt godk adareiiiiiiiiiiiiiiiii❤️❤️❤️❤️
        </div>

        <div class="photo-gallery">
            <!-- 1. එයාගේ තනි Photo එක -->
            <div class="photo-card">
                <img src="bf_photo.jpg" alt="Birthday Boy">
                <div class="photo-caption">My Handsome Boy 💖</div>
            </div>

            <!-- 2. පළමුවෙනි Couple Photo එක -->
            <div class="photo-card">
                <img src="us_photo1.jpg" alt="Us Together 1">
                <div class="photo-caption">Sweet Memories 💑</div>
            </div>

            <!-- 3. දෙවෙනි Couple Photo එක -->
            <div class="photo-card">
                <img src="us_photo2.jpg" alt="Us Together 2">
                <div class="photo-caption">Us Together Forever 💖</div>
            </div>
        </div>

        <div class="heart">💖🎂🎈✨</div>
    </div>

</body>
</html>
